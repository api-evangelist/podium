note: >-
  Podium ships exactly one first-party API client library — podium_ex, an Elixir package on
  hex.pm — and it is ABANDONED: latest release 0.7.0 published 2020-02-13, and the source repo
  github.com/podium/podium_ex was archived (read-only) with its last push on 2024-03-22. The
  library therefore predates the v4 / 2021.04.01 API generation that Podium's own reference now
  documents. No official JavaScript, Python, Ruby, PHP, Java, Go, .NET or Rust SDK exists: the
  npm, PyPI and RubyGems packages named "podium" belong to unrelated projects (podium-lib
  micro-frontends, @hapi/podium, a PyBee presentation tool, and a podlet gem) and are recorded
  below as explicit non-matches so a future run does not re-adopt them. Podium's published
  integration path is raw HTTP plus a Postman workspace and two JavaScript sample repos.
