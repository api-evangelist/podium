  policy: >-
    Podium releases a new dated version whenever the API changes in a backwards-incompatible way.
    Additive changes (new resources, new optional parameters, new response properties, property
    reordering, string format changes, object id length up to 255 characters, new webhook event
    types) are shipped inside the current version and are not considered breaking.
