name: Podium Plans and Pricing
description: >-
  Podium publishes no plan names, prices or quotas on its own website. Both pricing surfaces —
  https://www.podium.com/pricing and https://www.podium.com/getpricing — return HTTP 200 but
  render a sales funnel rather than a price list: /pricing states "Plans designed to fit your
  specific business needs, talk to our sales team for details" with a phone number and a demo
  CTA, and /getpricing is a lead-capture form ("Get a custom quote for your business"). API access
  is not sold separately; it is reached through the developer portal against an existing Podium
  account.
