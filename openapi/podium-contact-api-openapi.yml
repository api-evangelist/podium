                  moreInfo:
                    description: URL providing more information about the error.
                    type: string
                title: Error
                type: object
          description: Error response.
      summary: Delete a contact
      tags:
      - Contact
    get:
      callbacks: {}
      description: 'Get a contact with a conversation uid, email, or phone number.


