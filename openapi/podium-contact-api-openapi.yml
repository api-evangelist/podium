                        example: https://www.podium.com/
                        type: string
                    type: object
                type: object
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Podium code for the error.
                    type: integer
                  message:
                    description: Specific details about the error.
                    type:
                    - string
                    - 'null'
                  moreInfo:
                    description: URL providing more information about the error.
                    type: string
                title: Error
                type: object
          description: Error response.
      summary: Retrieve a contact
      tags:
      - Contact
    patch:
      callbacks: {}
      description: 'Update a contact with using a conversation uid, email, or phone number as an identifier.


        Required scope: `write_contacts`.'
      operationId: contact.update
      parameters:
      - description: Conversation uid, phone number, or email to identify the contact. Phone number should be formatted as '+15555555555'
        in: path
        name: identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              minProperties: 1
              properties:
                address:
                  description: The address of the resource
                  properties:
                    addressLine1:
                      description: The first line of the address
                      example: 123 Main St
                      type:
                      - string
                      - 'null'
                    addressLine2:
                      description: The second line of the address
                      example: Apt 101
                      type:
                      - string
                      - 'null'
                    city:
                      description: The city of the address
                      example: Lehi
                      type:
                      - string
                      - 'null'
                    country:
                      description: The country of the address
                      example: US
                      type:
                      - string
                      - 'null'
                    postalCode:
                      description: The postal code of the address
                      example: '84043'
                      type:
                      - string
                      - 'null'
                    state:
                      description: The state of the address
                      example: UT
                      type:
                      - string
                      - 'null'
                  type:
                  - object
                  - 'null'
                contactStatus:
                  description: A contact status, you need either the name or uid
                  properties:
                    name:
                      description: The status of the contact
                      example: Prospect
                      type: string
                    uid:
                      description: Podium unique identifier for contact status.
                      example: 00000000-0000-0000-0000-000000000000
                      format: uuid
                      type: string
                  type: object
                conversationUid:
                  description: Podium unique identifier for conversation.
                  example: 00000000-0000-0000-0000-000000000000
                  format: uuid
                  type: string
                email:
                  description: The email address of the resource
                  example: john.doe@podium.com
                  pattern: (.+)@(.+)\.(.+)
                  type: string
                locations:
                  description: List of location UIDs
                  items:
                    description: Podium unique identifier for location.
                    example: 00000000-0000-0000-0000-000000000000
                    format: uuid
                    type: string
                  type: array
                name:
                  description: The name of the resource
                  example: John Doe
                  type: string
                phoneNumber:
                  description: The phone number of the resource
                  example: '+18884441234'
                  pattern: ^\+[1-9]\d{1,15}$
                  type: string
              type: object
        description: Update contact params
        required: false
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/contact_upsert'
                  metadata:
                    description: Additional response data.
                    properties:
                      url:
