components:
  schemas:
    contact_attribute:
      description: Contact identifier
      properties:
        identifier:
          description: Identifier of the contact that can be used to retrieve the contact
          type: string
      title: contact_attribute
      type: object
    contact:
      description: A contact.
      properties:
        address:
          description: The address of the contact.
          properties:
            addressLine1:
              description: The first line of the address.
              type:
              - string
              - 'null'
            addressLine2:
              description: The second line of the address.
              type:
              - string
              - 'null'
            city:
              description: The city of the address.
              type:
              - string
              - 'null'
            country:
              description: The country of the address.
              type:
              - string
              - 'null'
            postalCode:
              description: The postal code of the address.
              type:
              - string
              - 'null'
            state:
              description: The state of the address.
              type:
              - string
              - 'null'
          type:
          - object
          - 'null'
        attributes:
          items:
            description: List of attribute resources of the contact.
            properties:
              dataType:
                description: The data type for the attribute value.
                type:
                - string
                - 'null'
              label:
                description: The label of the attribute.
                type: string
              ownerResource:
                description: The owner of the attribute resource.
                properties:
                  type:
                    description: Product or organization
                    type:
                    - string
                    - 'null'
                  uid:
                    description: Podium unique identifier for attribute.
                    example: 00000000-0000-0000-0000-000000000000
                    format: uuid
                    type:
                    - string
                    - 'null'
                type: object
              uid:
                description: Podium unique identifier for attribute.
                example: 00000000-0000-0000-0000-000000000000
                format: uuid
                type: string
              value:
                description: The value of the attribute.
            type:
            - object
            - 'null'
          type: array
        channels:
          description: List of channels for the contact.
          items:
            properties:
              createdAt:
                description: Time at which the resource was created. Date time is in Coordinated Universal Time (UTC).
                example: '2015-01-23T23:50:07Z'
                format: date-time
                type:
                - string
                - 'null'
              identifier:
                description: The unique identifier for the channel.
                example: '+15555555555'
                type: string
              label:
                description: A label for the channel.
                type:
