apis:
  - aid: podium:podium-api
    name: Podium API
    description: >-
      REST API for managing customer communications including messaging,
      reviews, payments, webchat, contacts, automations, and webhooks for
      local businesses. Base URL is https://api.podium.com/v4/ and uses
      OAuth 2.0 bearer token authentication with a rate limit of 300
      requests per minute on most routes. Published as 12 OpenAPI 3.0.0
      definitions covering 86 operations across Accounts, Appointments,
      Campaigns, Contacts, Conversations, Feedback (Surveys), Messenger,
      Payments, Phones, Products, Reviews and Webhooks, with a dated
      podium-version header, cursor pagination and 26 HMAC-SHA256 signed
      webhook event types.
    humanURL: https://docs.podium.com/reference/introduction
    baseURL: https://api.podium.com/v4/
